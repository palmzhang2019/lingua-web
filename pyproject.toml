[project]
name = "lingua-web"
version = "0.1.0"
description = "Japanese N2 language learning web prototype — material ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0,<3.1.6",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pypdf>=6.12.2",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
